apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movie-api
  template:
    metadata:
      labels:
        app: movie-api
    spec:
      containers:
      - name: movie-api
        image: movie-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: movie-api-service
spec:
  # LoadBalancer works great on Docker Desktop to give you 'localhost' access
  type: LoadBalancer 
  selector:
    app: movie-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000